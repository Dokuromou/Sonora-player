<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141625" />
      <stop offset="55%" stop-color="#0D0E17" />
      <stop offset="100%" stop-color="#1D132B" />
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D0E17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="50%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>
    <linearGradient id="bars" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />

  <!-- Subtle vinyl grooves -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer harmonic ring -->
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" stroke-dasharray="640 160" transform="rotate(-35 256 256)" />

  <!-- Acoustic bars + play triangle center -->
  <rect x="178" y="222" width="22" height="68" rx="11" fill="url(#bars)" opacity="0.9" />
  <rect x="216" y="184" width="22" height="144" rx="11" fill="url(#bars)" />
  <rect x="254" y="156" width="22" height="200" rx="11" fill="#FFFFFF" />
  <rect x="292" y="196" width="22" height="120" rx="11" fill="url(#ring)" />
  <rect x="330" y="230" width="22" height="52" rx="11" fill="url(#ring)" opacity="0.9" />
</svg>
